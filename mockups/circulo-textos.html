<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PLAYWORLD — el círculo y los textos</title>
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 400;
      src: url("../public/fonts/inter-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 500;
      src: url("../public/fonts/inter-latin-500-normal.woff2") format("woff2");
    }

    :root {
      --ink: #fff6ef;
      --mute: rgba(255, 246, 239, 0.62);
      --bg: #100a12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .largo { height: 1200vh; }

    .pin {
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(80% 70% at 50% 46%, rgba(90, 28, 48, 0.45), transparent 62%),
        var(--bg);
    }

    .lugar {
      position: absolute;
      top: 28px;
      left: 36px;
      z-index: 3;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .lugar span { display: block; margin-bottom: 6px; color: var(--ink); letter-spacing: 0.16em; }

    .anillo {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 0;
      height: 0;
    }

    .card {
      position: absolute;
      width: 9vmin;
      height: 9vmin;
      margin: -4.5vmin 0 0 -4.5vmin;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hueco {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 32vmin;
      height: 52vmin;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }

    .beat {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.8vmin;
      opacity: 0;
    }

    .frase {
      margin: 0;
      width: 100%;
      font-size: clamp(13px, 1.65vmin, 20px);
      line-height: 1.28;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .reliquia {
      display: block;
      object-fit: contain;
      border-radius: 4px;
    }
    .reliquia.tira { width: 34vmin; }
    .reliquia.papel,
    .reliquia.boleta {
      width: 16vmin;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }
    .beat:has(.reliquia) .frase { font-size: clamp(12px, 1.45vmin, 17px); }

    .play {
      position: absolute;
      left: 50%;
      top: 46%;
      z-index: 3;
      width: 9vmin;
      height: 9vmin;
      margin: -4.5vmin 0 0 -4.5vmin;
      border: 0;
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 246, 239, 0.14);
      box-shadow: inset 0 0 0 1.5px rgba(255, 246, 239, 0.7);
      opacity: 0;
      pointer-events: none;
    }
    .play svg { width: 28px; height: 28px; fill: currentColor; }

    .pista {
      position: absolute;
      left: 36px;
      right: 36px;
      bottom: 28px;
      height: 1px;
      background: rgba(255, 246, 239, 0.2);
    }
    .pista i {
      display: block;
      height: 1px;
      width: 0;
      background: var(--ink);
    }
  </style>
</head>
<body>
  <div class="largo">
    <div class="pin">
      <p class="lugar"><span>02</span> Mi primera vez</p>
      <div class="anillo" id="anillo"></div>
      <div class="hueco" id="hueco"></div>
      <button class="play" id="play" type="button" aria-label="Empieza en la fila">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 5.4v13.2L19.4 12 8.2 5.4Z" /></svg>
      </button>
      <div class="pista" aria-hidden="true"><i id="pista"></i></div>
    </div>
  </div>
  <script>
    const anios = [];
    for (let y = 2010; y <= 2026; y++) anios.push(y);

    const objetos = {
      1: { src: "../public/assets/home/primera/manilla-2019.jpg", alt: "Manilla del festival, 2019", clase: "tira" },
      2: { src: "../public/assets/home/primera/flyer-2016.jpg", alt: "Flyer del festival, 2016", clase: "papel" },
      4: { src: "../docs/ARTÍCULOS%20Y%20FOTOS%20PERSONALES_%20MI%20PRIMERA%20VEZ/Boleta_FEP_2017.JPG", alt: "Boleta del festival, 2017", clase: "boleta" }
    };

    const frases = [
      "¿Sabes cuándo vives algo por primera vez y, casi sin darte cuenta, sientes que te cambió la vida? Para mí, eso son los festivales de música.",
      "Nunca aprendí a tocar un instrumento (ni siquiera la flauta dulce). Así que hice lo que mejor sabía hacer: convertirme en fan. Coleccioné CDs, llené mi iPod de canciones y guardé boletas de conciertos como si fueran reliquias.",
      "Abril de 2016. Un sábado lluvioso, después de casi cuatro años convenciendo a mis papás, entré por primera vez al Festival Estéreo Picnic. La señal del celular desapareció casi de inmediato. Sentí que cruzaba un portal: adentro, el espacio y el tiempo obedecían otras reglas.",
      "Ese día entendí que un festival no era solo un lugar para escuchar música. Era un espacio donde miles de personas aceptábamos una misma regla: suspender la vida cotidiana para compartir algo irrepetible. Un patio de juegos para adultos.",
      "De cada edición quedan fotos, pulseras y boletas. Pero lo único que sobrevive a todas son las canciones: máquinas del tiempo capaces de devolvernos a un instante preciso, años después.",
      "Por eso reuní las cerca de 9.000 canciones que han sonado en las 15 ediciones del Festival Estéreo Picnic. Con Audio DNA, una herramienta que desarrollé, cada canción recibió una lectura emocional: alegría, melancolía, intensidad, nostalgia, oscuridad.",
      "Las plataformas usan estos datos para decidir qué escuchas, sin mostrarte cómo. Aquí es al revés: el archivo te muestra sus relaciones para que encuentres tu propio camino. Los números no reemplazan lo que sentiste; son otra forma de volver a ello.",
      "Esta no es la historia del festival. Es una manera de recorrerlo a través de la música que lo construyó. Y empieza como empiezan todos los festivales: en la fila."
    ];

    const anillo = document.getElementById("anillo");
    const hueco = document.getElementById("hueco");
    const play = document.getElementById("play");
    const pista = document.getElementById("pista");

    const cards = anios.map((year, i) => {
      const el = document.createElement("div");
      el.className = "card";
      const img = document.createElement("img");
      img.alt = String(year);
      img.src = "../public/assets/home/caratulas/" + year + ".jpg";
      el.appendChild(img);
      anillo.appendChild(el);
      const interior = i < 8;
      const n = interior ? 8 : 9;
      const k = interior ? i : i - 8;
      const ang = (k / n) * Math.PI * 2 + (interior ? 0 : Math.PI / n) - Math.PI / 2;
      const v = Math.min(innerWidth, innerHeight);
      const radio = (interior ? 0.36 : 0.5) * v;
      return { el, ang, radio };
    });

    const piezas = frases.map((texto, i) => {
      const beat = document.createElement("div");
      beat.className = "beat";
      const objeto = objetos[i];
      if (objeto) {
        const img = document.createElement("img");
        img.className = "reliquia " + objeto.clase;
        img.alt = objeto.alt;
        img.src = objeto.src;
        beat.appendChild(img);
      }
      const p = document.createElement("p");
      p.className = "frase";
      p.textContent = texto;
      beat.appendChild(p);
      hueco.appendChild(beat);
      return beat;
    });

    function colocar(giro) {
      for (const card of cards) {
        const a = card.ang + giro;
        card.el.style.transform = "translate(" + Math.cos(a) * card.radio + "px," + Math.sin(a) * card.radio + "px)";
      }
    }

    function medir() {
      const v = Math.min(innerWidth, innerHeight);
      cards.forEach((card, i) => {
        card.radio = (i < 8 ? 0.36 : 0.5) * v;
      });
    }

    function frame() {
      medir();
      const max = document.documentElement.scrollHeight - innerHeight;
      const p = max <= 0 ? 0 : Math.min(1, scrollY / max);
      const giro = p * 3.4;
      colocar(giro);
      cards.forEach((card, i) => {
        const llega = i / (cards.length - 1);
        const t = Math.min(1, Math.max(0, (0.28 + p * 0.85 - llega) / 0.08));
        card.el.style.opacity = String(t);
      });
      const relato = 0.88;
      const slot = relato / frases.length;
      const fade = Math.min(0.025, slot * 0.28);
      piezas.forEach((nodo, i) => {
        const entra = i * slot;
        const sale = (i + 1) * slot;
        let o = 0;
        if (i === 0 && p < fade) o = 1;
        else if (p < entra) o = 0;
        else if (p < entra + fade) o = (p - entra) / fade;
        else if (p < sale) o = 1;
        else if (p < sale + fade) o = 1 - (p - sale) / fade;
        nodo.style.opacity = String(Math.max(0, Math.min(1, o)));
      });
      const playT = Math.min(1, Math.max(0, (p - 0.92) / 0.06));
      play.style.opacity = String(playT);
      play.style.transform = "scale(" + (0.6 + 0.4 * playT) + ")";
      pista.style.width = (p * 100) + "%";
    }

    addEventListener("scroll", frame, { passive: true });
    addEventListener("resize", frame);
    frame();
  </script>
</body>
</html>
