<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLAYWORLD — el verbo</title>
    <style>
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/dm-sans-latin-500-normal.woff2") format("woff2");
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #100a12;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          162deg,
          #f48ca1 0%,
          #eb899f 24%,
          #c7709c 52%,
          #a74f98 78%,
          #a04294 100%
        );
      }

      .velo {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(70% 80% at 50% 32%, rgba(255, 255, 255, 0.12), transparent 62%),
          radial-gradient(100% 100% at 50% 50%, transparent 42%, rgba(18, 0, 36, 0.28) 100%);
      }

      main {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 48px;
        width: min(92vw, 760px);
      }

      .muestras {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 36px 42px;
      }

      figure {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      figcaption {
        font: 500 13px/1.3 "DM Sans", system-ui, sans-serif;
        color: #fff8f1;
      }

      .logo {
        width: min(92vw, 560px);
        aspect-ratio: 2400 / 644;
      }

      .logo span {
        display: block;
        width: 100%;
        height: 100%;
        background: #fff8f1;
        -webkit-mask: url("/assets/marca/playworld-subtexto.png") center / contain no-repeat;
        mask: url("/assets/marca/playworld-subtexto.png") center / contain no-repeat;
      }

      .verbo {
        --relleno: #4913bd;
        --tinta: #fff8f1;
        --encendido: #6a35e4;
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 0;
        background-color: #3a0bb4;
        background-image: linear-gradient(155deg, #5b16cc 0%, #3a0bb4 100%);
        color: var(--tinta);
        padding: 18px 26px 18px 28px;
        font: 500 18px/1 "DM Sans", system-ui, sans-serif;
        letter-spacing: -0.01em;
        cursor: pointer;
        transition: color 280ms cubic-bezier(0.22, 1, 0.36, 1);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }

      .verbo::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: var(--encendido);
        opacity: 0;
        pointer-events: none;
        transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .verbo:hover,
      .verbo:focus-visible,
      .verbo.is-on {
        --tinta: #fff8f1;
      }

      .verbo:hover::before,
      .verbo:focus-visible::before,
      .verbo.is-on::before {
        opacity: 1;
      }

      .verbo:focus-visible {
        outline: 2px solid #fff8f1;
        outline-offset: 8px;
      }

      .verbo span,
      .flecha { position: relative; z-index: 1; }

      .flecha {
        width: 18px;
        height: 10px;
        flex: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .verbo,
        .verbo::before { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="velo" aria-hidden="true"></div>
    <main>
      <p class="logo" aria-hidden="true"><span></span></p>
      <button class="verbo" type="button">
        <span>Abrir edición</span>
        <svg class="flecha" viewBox="0 0 18 10" aria-hidden="true">
          <path d="M0 5h16M12 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </main>
    <script>
      const botones = [...document.querySelectorAll(".verbo")];

      function azar(i) {
        const x = Math.sin(i * 12.9898) * 43758.5453;
        return x - Math.floor(x);
      }

      function dibujar() {
        const boton = botones[0];
        const w = boton.offsetWidth;
        const h = boton.offsetHeight;
        const dpr = 3;
        const W = Math.round(w * dpr);
        const H = Math.round(h * dpr);
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const g = canvas.getContext("2d");
        const img = g.createImageData(W, H);
        const data = img.data;
        const banda = 16 * dpr;
        const paso = 5.6 * dpr;
        const dy = paso * Math.sin(Math.PI / 3);
        const radioP = H / 2;

        function distAt(x, y) {
          const cx = Math.min(Math.max(x, radioP), W - radioP);
          return radioP - Math.hypot(x - cx, y - radioP);
        }

        const celdas = new Map();
        function celda(x, y) {
          const row = Math.floor(y / dy);
          const shift = (row & 1) ? paso * 0.5 : 0;
          const col = Math.floor((x - shift) / paso);
          const clave = row + ":" + col;
          const previa = celdas.get(clave);
          if (previa) return previa;
          const ccx = col * paso + paso * 0.5 + shift;
          const ccy = row * dy + dy * 0.5;
          const dist = distAt(ccx, ccy);
          const t = Math.max(0, Math.min(1, dist / banda));
          const ruido = 0.9 + azar(row * 47 + col * 13) * 0.18;
          let radio = (1.15 * dpr + Math.pow(t, 0.72) * 3.55 * dpr) * ruido;
          if (dist < radio + 0.4 * dpr) radio = Math.max(0, dist - 0.35 * dpr);
          const punto = { ccx, ccy, radio, dist };
          celdas.set(clave, punto);
          return punto;
        }

        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const dist = distAt(x + 0.5, y + 0.5);
            let alpha = 0;
            if (dist > 0.4) {
              if (dist >= banda) alpha = 255;
              else {
                const c = celda(x + 0.5, y + 0.5);
                if (c.radio > 0.55 * dpr && Math.hypot(x + 0.5 - c.ccx, y + 0.5 - c.ccy) <= c.radio) {
                  alpha = 255;
                }
              }
            }
            const i = (y * W + x) * 4;
            data[i] = 255;
            data[i + 1] = 255;
            data[i + 2] = 255;
            data[i + 3] = alpha;
          }
        }

        g.putImageData(img, 0, 0);
        const url = canvas.toDataURL();
        for (const nodo of botones) {
          nodo.style.webkitMaskImage = `url("${url}")`;
          nodo.style.maskImage = `url("${url}")`;
        }
      }

      dibujar();
      window.addEventListener("resize", dibujar);
    </script>
  </body>
</html>
