<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLAYWORLD — el verbo</title>
    <style>
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/dm-sans-latin-500-normal.woff2") format("woff2");
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #100a12;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          162deg,
          #f48ca1 0%,
          #eb899f 24%,
          #c7709c 52%,
          #a74f98 78%,
          #a04294 100%
        );
      }

      .velo {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(70% 80% at 50% 32%, rgba(255, 255, 255, 0.12), transparent 62%),
          radial-gradient(100% 100% at 50% 50%, transparent 42%, rgba(18, 0, 36, 0.28) 100%);
      }

      main {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 56px;
        width: min(92vw, 640px);
      }

      .logo {
        width: min(92vw, 560px);
        aspect-ratio: 2400 / 644;
      }

      .logo span {
        display: block;
        width: 100%;
        height: 100%;
        background: #fff8f1;
        -webkit-mask: url("/assets/marca/playworld-subtexto.png") center / contain no-repeat;
        mask: url("/assets/marca/playworld-subtexto.png") center / contain no-repeat;
      }

      .verbo {
        --relleno: #140c12;
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 0;
        background: none;
        color: #fff8f1;
        padding: 18px 26px 18px 28px;
        font: 500 18px/1 "DM Sans", system-ui, sans-serif;
        letter-spacing: -0.01em;
        cursor: pointer;
      }

      .verbo:hover,
      .verbo:focus-visible { --relleno: #f07810; }

      .verbo:focus-visible {
        outline: 2px solid #fff8f1;
        outline-offset: 8px;
      }

      .forma {
        position: absolute;
        overflow: visible;
        pointer-events: none;
        z-index: 0;
        color: var(--relleno);
        transition: color 280ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .verbo span,
      .flecha { position: relative; z-index: 1; }

      .flecha {
        width: 18px;
        height: 10px;
        flex: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .forma { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="velo" aria-hidden="true"></div>
    <main>
      <p class="logo" aria-hidden="true"><span></span></p>
      <button class="verbo" type="button">
        <svg class="forma" aria-hidden="true"></svg>
        <span>Abrir edición</span>
        <svg class="flecha" viewBox="0 0 18 10" aria-hidden="true">
          <path
            d="M0 5h16M12 1l4 4-4 4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </main>
    <script>
      const ns = "http://www.w3.org/2000/svg";
      const boton = document.querySelector(".verbo");
      const forma = boton.querySelector(".forma");

      function azar(i) {
        const x = Math.sin(i * 12.9898) * 43758.5453;
        return x - Math.floor(x);
      }

      function punto(d, w, h) {
        const r = h / 2;
        const recta = Math.max(0, w - h);
        const arco = Math.PI * r;
        if (d < recta) return { x: r + d, y: 0, nx: 0, ny: -1 };
        d -= recta;
        if (d < arco) {
          const a = -Math.PI / 2 + (d / arco) * Math.PI;
          const nx = Math.cos(a);
          const ny = Math.sin(a);
          return { x: w - r + nx * r, y: r + ny * r, nx, ny };
        }
        d -= arco;
        if (d < recta) return { x: w - r - d, y: h, nx: 0, ny: 1 };
        d -= recta;
        const a = Math.PI / 2 + (d / arco) * Math.PI;
        const nx = Math.cos(a);
        const ny = Math.sin(a);
        return { x: r + nx * r, y: r + ny * r, nx, ny };
      }

      function filtro(id, desvio) {
        const nodo = document.createElementNS(ns, "filter");
        nodo.id = id;
        nodo.setAttribute("x", "-40%");
        nodo.setAttribute("y", "-40%");
        nodo.setAttribute("width", "180%");
        nodo.setAttribute("height", "180%");
        const blur = document.createElementNS(ns, "feGaussianBlur");
        blur.setAttribute("stdDeviation", String(desvio));
        nodo.appendChild(blur);
        return nodo;
      }

      function anillo(padre, w, h, inset, paso, radio, variacion, semilla) {
        const iw = w - inset * 2;
        const ih = h - inset * 2;
        if (iw < 8 || ih < 8) return;
        const radioEsquina = ih / 2;
        const largo = 2 * Math.max(0, iw - ih) + 2 * Math.PI * radioEsquina;
        for (let d = paso * 0.5, i = 0; d < largo - 0.6; d += paso, i++) {
          const p = punto(d, iw, ih);
          const circulo = document.createElementNS(ns, "circle");
          circulo.setAttribute("cx", (p.x + inset).toFixed(2));
          circulo.setAttribute("cy", (p.y + inset).toFixed(2));
          circulo.setAttribute("r", (radio + azar(i + semilla) * variacion).toFixed(2));
          padre.appendChild(circulo);
        }
      }

      function dibujar() {
        const w = boton.offsetWidth;
        const h = boton.offsetHeight;
        forma.setAttribute("viewBox", `0 0 ${w} ${h}`);
        forma.setAttribute("width", String(w));
        forma.setAttribute("height", String(h));
        forma.style.left = "0";
        forma.style.top = "0";
        forma.replaceChildren();

        const defs = document.createElementNS(ns, "defs");
        defs.append(filtro("lejos", 0.95), filtro("medio", 0.28));
        const recorte = document.createElementNS(ns, "clipPath");
        recorte.id = "pastilla";
        const marco = document.createElementNS(ns, "rect");
        marco.setAttribute("width", String(w));
        marco.setAttribute("height", String(h));
        marco.setAttribute("rx", String(h / 2));
        recorte.appendChild(marco);
        defs.appendChild(recorte);
        forma.appendChild(defs);

        const cuerpo = document.createElementNS(ns, "g");
        cuerpo.setAttribute("clip-path", "url(#pastilla)");
        cuerpo.setAttribute("fill", "currentColor");

        const nucleo = document.createElementNS(ns, "rect");
        const margen = 6.2;
        nucleo.setAttribute("x", String(margen));
        nucleo.setAttribute("y", String(margen));
        nucleo.setAttribute("width", String(w - margen * 2));
        nucleo.setAttribute("height", String(h - margen * 2));
        nucleo.setAttribute("rx", String((h - margen * 2) / 2));
        cuerpo.appendChild(nucleo);

        const capas = [
          { id: "lejos", opacidad: 0.85, inset: 5.1, paso: 3.3, radio: 1.45, variacion: 0.2, semilla: 20 },
          { id: "medio", opacidad: 1, inset: 3.2, paso: 4.0, radio: 1.2, variacion: 0.22, semilla: 40 },
          { id: null, opacidad: 1, inset: 1.2, paso: 5.2, radio: 0.95, variacion: 0.32, semilla: 3 },
        ];
        for (const capa of capas) {
          const grupo = document.createElementNS(ns, "g");
          grupo.setAttribute("opacity", String(capa.opacidad));
          if (capa.id) grupo.setAttribute("filter", `url(#${capa.id})`);
          anillo(grupo, w, h, capa.inset, capa.paso, capa.radio, capa.variacion, capa.semilla);
          cuerpo.appendChild(grupo);
        }

        forma.appendChild(cuerpo);
      }

      dibujar();
      window.addEventListener("resize", dibujar);
    </script>
  </body>
</html>
